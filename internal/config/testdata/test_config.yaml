programs:
  test1:
    command: echo "Hello, World!"
    directory: .
    autostart: true
    autorestart: true
    startsecs: 1
    startretries: 3
    user: administrator
    environment:
      TEST_VAR: test_value
      PATH: "%PATH%"

  test2:
    command: ping localhost -t
    directory: .
    autostart: false
    autorestart: true
    startsecs: 2
    startretries: 5
